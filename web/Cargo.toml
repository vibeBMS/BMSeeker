[package]
name = "bmseeker-web"
description = "BMSeeker in a web page: the command-line tool's commands on a browser's storage, run in a worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vibeBMS/BMSeeker"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bmseeker = { path = "..", features = ["cli"] }
clap = { version = "4", default-features = false, features = ["std"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["XmlHttpRequest", "XmlHttpRequestResponseType"] }

[dev-dependencies]
bmseeker = { path = "..", features = ["cli", "testkit"] }
