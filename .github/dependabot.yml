# Weekly dependency updates. Minor and patch releases of each ecosystem come
# as one grouped pull request; a major release gets its own. A release is
# taken once it is 7 days old (cooldown): the merge workflow merges what
# passes CI with no person looking, and one that is withdrawn or reported in
# its first week then never arrives. (Security updates do not wait.)
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /gui
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
