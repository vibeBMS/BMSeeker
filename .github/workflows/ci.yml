name: CI

# Checks, then the release builds (build.yml); for main, the "nightly"
# prerelease and the web site on GitHub Pages, both with the version
# <version>-nightly.<run>+<commit> (tools/ci_version.sh). A build that failed
# keeps its previous file; the notes say which files this commit brought.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# what a job's token may do, whatever the repository's default is: read the
# repository (build.yml, which the build job calls, asks for the same). The
# jobs that need more say so (cache-prune, pages, release).
permissions:
  contents: read

# A newer commit on the same branch or pull request cancels the older run
# (the organization's hosted runners are limited: 20 jobs, 5 macOS).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Only the default branch's cache of each job used last stays (this
  # workflow's and build.yml's): other refs' entries and the default
  # branch's others (left when Cargo.lock, the toolchain or go.sum
  # changed) are deleted, so the repository's 10 GB hold one set. It runs
  # first, beside the builds, so a newer push cancelling this run does not
  # skip it, and the space is free before this run saves. A replaced key
  # stays until the next push: it is what this run's jobs restore from.
  cache-prune:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAIN: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          # rust-cache: v0-rust-<key>-<job>-<os>-<arch>-<environment>-<lockfiles>;
          # setup-go: setup-go-<os>-<arch>-<image>-go-<version>-<go.sum hash>;
          # any other key: only other refs' entries
          gh cache list --limit 1000 --sort last_accessed_at --order desc \
            --json id,key,ref,sizeInBytes --jq '.[] | "\(.id)\t\(.key)\t\(.ref)\t\(.sizeInBytes)"' |
            awk -F'\t' -v main="$MAIN" '{
              job = $2
              if (job ~ /^v0-rust-/) sub(/-[0-9a-f]+-[0-9a-f]+$/, "", job)
              else if (job ~ /^setup-go-/) sub(/-[0-9a-f]+$/, "", job)
              if ($3 != main || (job != $2 && seen[job]++)) print $1 "\t" $2 "\t" $3 "\t" int($4 / 1048576) " MB"
            }' |
            while IFS=$'\t' read -r id key ref size; do
              echo "delete $key ($ref, $size)"
              gh cache delete "$id"
            done

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (the action's branch)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # only the default branch writes the cache (other branches and pull
          # requests read it), so their entries do not evict it
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      # which updates the Dependabot merge workflow holds
      - run: python3 .github/dependabot_merge_test.py
        if: matrix.os == 'ubuntu-latest'
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --all-targets --features cli -- -D warnings
      # the library as vibeBMS links it: no features, and its tests' testkit
      # (with tests/api_vibe.rs, the items vibe names from it)
      - run: cargo clippy --lib -- -D warnings
      - run: cargo clippy --lib --test api_vibe --features testkit -- -D warnings
      - run: cargo test --features cli

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (the action's branch)
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # only the default branch writes the cache (other branches and pull
          # requests read it), so their entries do not evict it
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: cargo check --lib --target wasm32-unknown-unknown

  gui:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      # (build.yml builds it)
      - run: go vet ./...
      - run: go test ./...

  # BMSeeker web: the commands' wasm and its tests, and the GUI for js/wasm
  # (build.yml builds the site, web/build.sh)
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (the action's branch)
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # only the default branch writes the cache (other branches and pull
          # requests read it), so their entries do not evict it
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - run: cargo fmt -p bmseeker-web --check
      - run: cargo clippy -p bmseeker-web --all-targets -- -D warnings
      - run: cargo clippy -p bmseeker-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p bmseeker-web
      - run: GOOS=js GOARCH=wasm go vet ./...
        working-directory: gui
      - run: node web/test/proxy.mjs

  # the release builds, once the checks pass (a pull request's too, as
  # artifacts)
  build:
    needs: [test, wasm, gui, web]
    uses: ./.github/workflows/build.yml
    with:
      channel: nightly

  # main -> the site root (https://vibebms.github.io/BMSeeker/, beside
  # vibeBMS's /vibe/)
  pages:
    needs: build
    # (only when every build passed: the site and the nightly then agree)
    if: ${{ needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # GitHub Pages by Actions (Settings > Pages > Source: GitHub Actions):
    # each deploy replaces the whole site
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # one deploy at a time
    concurrency:
      group: web-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bmseeker-web
      - run: unzip -q bmseeker-web.zip -d site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    name: nightly release
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'failure') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # one release at a time: release.yml's writes latest.json and
    # builds.json here too (a newer push cancels this whole run, and its
    # own publishes; the release step publishes only the branch's head)
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      # the version the builds were given
      - run: tools/ci_version.sh
      - uses: actions/download-artifact@v8
        with:
          pattern: bmseeker-*
          path: out
          merge-multiple: true
      - run: tools/release_manifests.sh out
      - name: release
        env:
          SHA: ${{ github.sha }}
        run: |
          # only the branch's head is published: a newer push has its own run,
          # but for a commit that skips CI ([skip ci] and the like), which has
          # none, this commit stays the latest build
          moved_on() { [ "$(tools/ci_moved_on.sh "$SHA")" = yes ]; }
          if moved_on; then
            echo "$GITHUB_REF_NAME has moved on from ${SHA:0:7}; its own run publishes it"
            exit 0
          fi
          # the tag follows the latest commit
          if ! gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true >/dev/null \
            && ! gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$SHA" >/dev/null; then
            moved_on && { echo "$GITHUB_REF_NAME moved on meanwhile"; exit 0; }
            exit 1
          fi
          # shellcheck disable=SC2016 # Markdown's backquotes
          files="$(cd out && printf '`%s` ' *)"
          notes="$(
            echo "The latest build of \`${GITHUB_REF_NAME}\`: version $BMSEEKER_VERSION ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            echo
            echo "Files from this commit: $files"
            echo
            echo "- \`bmseeker-*\` is the command-line tool, \`bmseeker-gui-*\` the window (with the tool inside it)."
            echo "- Linux / macOS: \`chmod +x bmseeker-*\`; on macOS also \`xattr -d com.apple.quarantine bmseeker-*\`."
            echo "  The macOS files are universal (Apple silicon and Intel). Linux needs glibc 2.35."
            echo "- Web: unzip \`bmseeker-web.zip\` and serve the folder over HTTP(S), or use https://vibebms.github.io/BMSeeker/."
          )"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly" --notes "$notes" --target "$SHA"
          else
            gh release create nightly --prerelease --title "Nightly" --notes "$notes" --target "$SHA"
          fi
          gh release upload nightly out/* --clobber
          # files no build makes any more; a failed build's stay (latest.json
          # keeps their entries)
          keep="$(ls out; jq -r '.channels.nightly.files | keys[]' out/latest.json; echo bmseeker-web.zip)"
          gh release view nightly --json assets --jq '.assets[].name' | while read -r a; do
            grep -qxF "$a" <<< "$keep" || gh release delete-asset nightly "$a" --yes
          done
