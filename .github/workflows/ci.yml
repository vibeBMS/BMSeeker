name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same branch or pull request cancels the older run
# (the organization's hosted runners are limited: 20 jobs, 5 macOS).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Only the default branch's newest cache of each job stays (this
  # workflow's and the nightly's, build.yml): other refs' entries and the default branch's older ones (left when
  # Cargo.lock, the toolchain or go.sum changed) are deleted, so the
  # repository's 10 GB hold one set. It runs first, beside the builds, so a
  # newer push cancelling this run does not skip it, and the space is free
  # before this run saves. A replaced key stays until the next push: it is
  # what this run's jobs restore from.
  cache-prune:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAIN: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          # rust-cache: v0-rust-<key>-<job>-<os>-<arch>-<environment>-<lockfiles>;
          # setup-go: setup-go-<os>-<arch>-<image>-go-<version>-<go.sum hash>;
          # any other key: only other refs' entries
          gh cache list --limit 1000 --sort created_at --order desc \
            --json id,key,ref,sizeInBytes --jq '.[] | "\(.id)\t\(.key)\t\(.ref)\t\(.sizeInBytes)"' |
            awk -F'\t' -v main="$MAIN" '{
              job = $2
              if (job ~ /^v0-rust-/) sub(/-[0-9a-f]+-[0-9a-f]+$/, "", job)
              else if (job ~ /^setup-go-/) sub(/-[0-9a-f]+$/, "", job)
              if ($3 != main || (job != $2 && seen[job]++)) print $1 "\t" $2 "\t" $3 "\t" int($4 / 1048576) " MB"
            }' |
            while IFS=$'\t' read -r id key ref size; do
              echo "delete $key ($ref, $size)"
              gh cache delete "$id"
            done

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # only the default branch writes the cache (other branches and pull
          # requests read it), so their entries do not evict it
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --all-targets --features cli -- -D warnings
      - run: cargo test --features cli

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # only the default branch writes the cache (other branches and pull
          # requests read it), so their entries do not evict it
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: cargo check --lib --target wasm32-unknown-unknown

  gui:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  # BMSeeker web (web/build.sh): the commands' wasm, its tests, and the GUI
  # for js/wasm (the nightly, nightly.yml, publishes it to GitHub Pages)
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # only the default branch writes the cache (other branches and pull
          # requests read it), so their entries do not evict it
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      - run: cargo fmt -p bmseeker-web --check
      - run: cargo clippy -p bmseeker-web --all-targets -- -D warnings
      - run: cargo clippy -p bmseeker-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p bmseeker-web
      - run: GOOS=js GOARCH=wasm go vet ./...
        working-directory: gui
      - run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)"
      - run: web/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: BMSeeker-web
          path: web/dist
