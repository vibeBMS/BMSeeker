[package]
name = "bmseeker"
description = "BMS library tools: difficulty tables, downloads from where authors link songs, unpacking, and putting charts into their songs' folders"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vibeBMS/BMSeeker"
keywords = ["bms", "rhythm-game", "beatoraja", "lr2"]
categories = ["command-line-utilities", "games"]

[lib]
name = "bmseeker"
path = "src/lib.rs"

# the command-line tool: `cargo install bmseeker --features cli`
[[bin]]
name = "bmseeker"
required-features = ["cli"]

[features]
cli = ["dep:clap", "tools", "serde_json/preserve_order"]
# what only the command-line tool does: an event's works, probing a link,
# exporting a table
tools = []
# archives and folders for tests (a player's too)
testkit = []

[dependencies]
serde = { version = "1", features = ["derive"] }
# (the command-line tool's works.json keeps its keys in order: `cli`)
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }
log = "0.4"
encoding_rs = "0.8"
md-5 = "0.11"
sha2 = "0.11"
url = "2"
web-time = "1"
# archives (.zip: deflate by flate2's Rust backend, below, which builds for
# wasm32; .7z; .rar: Apache-2.0 with the UnRAR license restriction; .lzh)
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "ppmd"] }
unrar-rs = { version = "0.16.4", default-features = false, features = ["crypto-rust"] }
delharc = "0.8"
# titles and artists compared in NFKC
unicode-normalization = "0.1"
# MEGA files are AES-128-CTR encrypted
aes = "0.9"
# beatoraja table caches (.bmt) are gzip
flate2 = "1"

# Natively (desktop, iOS, Android): HTTP. 3.5 for its transport API (a
# download's connection watching its progress), which may change in a minor
# version.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "~3.5", default-features = false, features = ["rustls", "gzip"] }

# Desktop: trust the OS certificate store (corporate proxies, custom CAs).
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
ureq = { version = "~3.5", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
