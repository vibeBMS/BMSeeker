[package]
name = "bmseeker"
description = "BMS library tools: difficulty tables, downloads from where authors link songs, unpacking, and putting charts into their songs' folders"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vibeBMS/BMSeeker"
keywords = ["bms", "rhythm-game", "beatoraja", "lr2"]
categories = ["command-line-utilities", "games"]

[lib]
name = "bmseeker"
path = "src/lib.rs"

# the command-line tool: `cargo install bmseeker --features cli`
[[bin]]
name = "bmseeker"
required-features = ["cli"]

[features]
cli = ["dep:clap"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# works.json keeps its keys in order
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
clap = { version = "4", features = ["derive"], optional = true }
log = "0.4"
encoding_rs = "0.8"
md-5 = "0.10"
sha2 = "0.10"
url = "2"
web-time = "1"
ehttp = "0.7"
# archives (.zip; .7z; .rar: Apache-2.0 with the UnRAR license restriction;
# .lzh: 0.6, 0.7 and later need a newer Rust)
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "ppmd"] }
unrar-rs = { version = "0.16.4", default-features = false, features = ["crypto-rust"] }
delharc = "0.6.2"
# titles and artists compared in NFKC
unicode-normalization = "0.1"
# MEGA files are AES-128-CTR encrypted
aes = "0.9"
# beatoraja table caches (.bmt) are gzip
flate2 = "1"

# Desktop: trust the OS certificate store (corporate proxies, custom CAs).
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
ehttp = { version = "0.7", features = ["platform-verifier"] }

# Natively (desktop, iOS, Android): where a download's redirects ended
# (ehttp's own client)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
