# cargo-about's configuration for THIRD_PARTY_LICENSES.md (tools/gen_licenses.sh
# makes it; DESIGN.md, "Releases").
#
# Every licence a shipped crate is used under is named here, in the order
# they are chosen for a crate that offers several (`MIT OR Apache-2.0` is
# taken as Apache-2.0: one text for most crates): a crate under any other
# licence stops the generation, for a person to read that licence first.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "bzip2-1.0.6",
]

# what the releases are built for (.github/workflows/build.yml): the crates
# any of them links
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]

# Tests' crates are not shipped. Build scripts' and proc-macros' crates are
# kept: the derives' output is in the program, and the rest cost a few lines.
ignore-dev-dependencies = true
# (this workspace's crates are BMSeeker itself: tools/gen_licenses.py leaves
# them out)
private = { ignore = true }

# ring declares `Apache-2.0 AND ISC` and keeps the texts in two files (LICENSE
# says which code each covers); without this its source files' headers are
# taken for licence files, one text per header
[ring.clarify]
license = "Apache-2.0 AND ISC"

[[ring.clarify.files]]
path = "LICENSE-BoringSSL"
license = "Apache-2.0"
checksum = "005fc765ddc5115da796cca915baa9557abae13ff35e0a47c47affc56f6c414d"

[[ring.clarify.files]]
path = "LICENSE-other-bits"
license = "ISC"
checksum = "f025ccfb7dfb6bdfedc75ca0f67acc69e6fb4998143d834f7c2f38a29989680f"

# unrar-rs has a licence file and no expression: Apache-2.0 with the UnRAR
# condition on its RAR engine, which the file states before the Apache text
# (the whole file is kept, as it asks)
[unrar-rs.clarify]
license = "Apache-2.0"

[[unrar-rs.clarify.files]]
path = "LICENSE"
checksum = "97dfd1950dfb0901afbf6e51cae496e12281e97f670fdb2a2aab3252d2561086"

# The crates below ship their licence's text in a file cargo-about does not
# recognise (most: Apache-2.0's terms without its appendix), or in parts of one:
# each names the file, so that the text and the notices printed are the
# crate's own. A clarification is checked by its checksum (tools/gen_licenses.sh
# stops when cargo-about reports one that does not match, and
# tools/gen_licenses.py when its expression is not the crate's); a crate that
# uses a standard text while it has a licence file stops it too. What is not a
# licence text (COPYRIGHT files, third parties' notices, the licence file of a
# crate's repository) is in licence-notices.toml.

[constant_time_eq.clarify]
license = "CC0-1.0 OR MIT-0 OR Apache-2.0"
files = [{ path = "LICENSE-APACHE", license = "Apache-2.0", checksum = "62c7a1e35f56406896d7aa7ca52d0cc0d272ac022b5d2796e7d6905db8a3636a" }]

# its Zlib-licensed code (Mark Adler's crccomb.c) has its licence in its source
# file, src/combine.rs, and no file of its own (the holder: licence-notices.toml)
[crc-turbo.clarify]
license = "(MIT OR Apache-2.0) AND Zlib"
files = [
    { path = "LICENSE-Apache", license = "Apache-2.0", checksum = "c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4" },
    { path = "src/combine.rs", license = "Zlib", start = "This software is provided 'as-is'", end = "any source distribution.", checksum = "9562f6577770256f780970075f3bbedb1db44ab0fc43a05a670301697768dce6" },
]

[itoa.clarify]
license = "MIT OR Apache-2.0"
files = [{ path = "LICENSE-APACHE", license = "Apache-2.0", checksum = "62c7a1e35f56406896d7aa7ca52d0cc0d272ac022b5d2796e7d6905db8a3636a" }]

